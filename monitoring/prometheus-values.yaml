# Prometheus Stack Helm Values
# This configures Prometheus, Grafana, and AlertManager

prometheus:
  prometheusSpec:
    # Resource limits
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 4Gi
    
    # Retention policy
    retention: 7d
    retentionSize: "45GB"
    
    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    
    # Service monitor selector
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    
    # Additional scrape configs for custom metrics
    additionalScrapeConfigs:
      - job_name: 'ml-serving'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

grafana:
  # Admin credentials
  adminPassword: ${grafana_admin_password}
  
  # Enable persistence
  persistence:
    enabled: true
    size: 10Gi
  
  # Resource limits
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  
  # Datasources
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-kube-prometheus-prometheus:9090
          access: proxy
          isDefault: true
  
  # Dashboard providers
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  
  # Grafana configuration
  grafana.ini:
    server:
      root_url: http://localhost:3000
    analytics:
      check_for_updates: false
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/default/ml-serving-dashboard.json

alertmanager:
  alertmanagerSpec:
    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    
    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
  
  # AlertManager configuration
  config:
    global:
      resolve_timeout: 5m
      %{ if slack_webhook_url != "" }
      slack_api_url: '${slack_webhook_url}'
      %{ endif }
    
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical'
        - match:
            severity: warning
          receiver: 'warning'
    
    receivers:
      - name: 'default'
        %{ if slack_webhook_url != "" }
        slack_configs:
          - channel: '#ml-platform-alerts'
            title: 'ML Platform Alert'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        %{ endif }
      
      - name: 'critical'
        %{ if slack_webhook_url != "" }
        slack_configs:
          - channel: '#ml-platform-critical'
            title: '🚨 CRITICAL: ML Platform Alert'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        %{ endif }
        email_configs:
          - to: '${alert_email}'
            from: 'alertmanager@ml-platform.com'
            smarthost: 'localhost:25'
            require_tls: false
      
      - name: 'warning'
        %{ if slack_webhook_url != "" }
        slack_configs:
          - channel: '#ml-platform-alerts'
            title: '⚠️ WARNING: ML Platform Alert'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        %{ endif }

# Additional components
kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

# Disable components we don't need
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
