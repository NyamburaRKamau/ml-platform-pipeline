groups:
  - name: ml-serving-alerts
    interval: 30s
    rules:
      # High Latency Alert
      - alert: HighPredictionLatency
        expr: |
          histogram_quantile(0.95, 
            rate(model_prediction_latency_seconds_bucket[5m])
          ) > 0.1
        for: 5m
        labels:
          severity: warning
          component: ml-serving
        annotations:
          summary: "High prediction latency detected"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 100ms) for model {{ 
$labels.model_version }}"
      
      # Critical Latency Alert
      - alert: CriticalPredictionLatency
        expr: |
          histogram_quantile(0.95, 
            rate(model_prediction_latency_seconds_bucket[5m])
          ) > 0.5
        for: 2m
        labels:
          severity: critical
          component: ml-serving
        annotations:
          summary: "CRITICAL: Very high prediction latency"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 500ms) for model {{ 
$labels.model_version }}"
      
      # Error Rate Alert
      - alert: HighErrorRate
        expr: |
          sum(rate(model_predictions_total{status="error"}[5m])) 
          / 
          sum(rate(model_predictions_total[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
          component: ml-serving
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 1%)"
      
      # Critical Error Rate
      - alert: CriticalErrorRate
        expr: |
          sum(rate(model_predictions_total{status="error"}[5m])) 
          / 
          sum(rate(model_predictions_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          component: ml-serving
        annotations:
          summary: "CRITICAL: Very high error rate"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
      
      # No Predictions Alert
      - alert: NoPredictions
        expr: |
          sum(rate(model_predictions_total[5m])) == 0
        for: 10m
        labels:
          severity: critical
          component: ml-serving
        annotations:
          summary: "ML service is not receiving requests"
          description: "No predictions have been made in the last 10 minutes"
      
      # Model Not Loaded
      - alert: ModelNotLoaded
        expr: |
          model_load_timestamp == 0
        for: 5m
        labels:
          severity: critical
          component: ml-serving
        annotations:
          summary: "Model failed to load"
          description: "Model has not been loaded successfully"
      
      # High Fraud Prediction Rate (example domain-specific alert)
      - alert: AnomalouslyHighFraudRate
        expr: |
          sum(rate(fraud_predictions_total[5m]))
          /
          sum(rate(model_predictions_total[5m])) > 0.20
        for: 15m
        labels:
          severity: warning
          component: ml-serving
        annotations:
          summary: "Unusually high fraud detection rate"
          description: "Fraud rate is {{ $value | humanizePercentage }} (baseline: ~5%)"
      
      # Low Fraud Prediction Rate (possible model degradation)
      - alert: AnomalouslyLowFraudRate
        expr: |
          sum(rate(fraud_predictions_total[5m]))
          /
          sum(rate(model_predictions_total[5m])) < 0.01
        for: 15m
        labels:
          severity: warning
          component: ml-serving
        annotations:
          summary: "Unusually low fraud detection rate"
          description: "Fraud rate is {{ $value | humanizePercentage }} (baseline: ~5%)"

  - name: kubernetes-alerts
    interval: 30s
    rules:
      # Pod Restart Alert
      - alert: PodRestarting
        expr: |
          rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting"
          description: "Pod has restarted {{ $value }} times in the last 15 minutes"
      
      # Pod Not Ready
      - alert: PodNotReady
        expr: |
          kube_pod_status_phase{phase!~"Running|Succeeded"} == 1
        for: 10m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
          description: "Pod has been in {{ $labels.phase }} state for more than 10 minutes"
      
      # High CPU Usage
      - alert: HighCPUUsage
        expr: |
          sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (namespace, pod, container)
          /
          sum(kube_pod_container_resource_limits{resource="cpu"}) by (namespace, pod, container)
          > 0.80
        for: 10m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "High CPU usage in {{ $labels.namespace }}/{{ $labels.pod }}"
          description: "CPU usage is {{ $value | humanizePercentage }} of limit"
      
      # High Memory Usage
      - alert: HighMemoryUsage
        expr: |
          sum(container_memory_working_set_bytes{container!=""}) by (namespace, pod, container)
          /
          sum(kube_pod_container_resource_limits{resource="memory"}) by (namespace, pod, container)
          > 0.85
        for: 10m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "High memory usage in {{ $labels.namespace }}/{{ $labels.pod }}"
          description: "Memory usage is {{ $value | humanizePercentage }} of limit"
      
      # Node Not Ready
      - alert: NodeNotReady
        expr: |
          kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
          component: kubernetes
        annotations:
          summary: "Node {{ $labels.node }} is not ready"
          description: "Node has been in NotReady state for more than 5 minutes"
      
      # Node Disk Pressure
      - alert: NodeDiskPressure
        expr: |
          kube_node_status_condition{condition="DiskPressure",status="true"} == 1
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Node {{ $labels.node }} has disk pressure"
          description: "Node is experiencing disk pressure"
      
      # Node Memory Pressure
      - alert: NodeMemoryPressure
        expr: |
          kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Node {{ $labels.node }} has memory pressure"
          description: "Node is experiencing memory pressure"
      
      # HPA at Max Replicas
      - alert: HPAMaxedOut
        expr: |
          kube_horizontalpodautoscaler_status_current_replicas
          /
          kube_horizontalpodautoscaler_spec_max_replicas >= 1
        for: 15m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} at max replicas"
          description: "HPA has been at maximum replicas for 15 minutes. Consider increasing maxReplicas."

  - name: cost-alerts
    interval: 1h
    rules:
      # High Node Count
      - alert: HighNodeCount
        expr: |
          count(kube_node_info) > 4
        for: 1h
        labels:
          severity: warning
          component: cost
        annotations:
          summary: "High number of nodes running"
          description: "{{ $value }} nodes are running (review if necessary)"
      
      # Unused PVCs
      - alert: UnusedPersistentVolumes
        expr: |
          kube_persistentvolumeclaim_status_phase{phase="Bound"} == 1
          unless on(persistentvolumeclaim, namespace)
          kube_pod_spec_volumes_persistentvolumeclaims_info
        for: 24h
        labels:
          severity: info
          component: cost
        annotations:
          summary: "Unused PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}"
          description: "PVC has been unused for 24 hours. Consider deleting to save costs."
